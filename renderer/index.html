<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다운로드 폴더 정리 도구</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📂 다운로드 폴더 정리 도구</h1>
      <p class="subtitle">파일을 자동으로 카테고리별로 정리합니다</p>
    </header>

    <main>
      <section class="folder-selection">
        <div class="input-group">
          <label for="folderPath">정리할 폴더:</label>
          <input type="text" id="folderPath" readonly placeholder="폴더를 선택하세요">
          <button id="selectFolderBtn" class="btn btn-secondary">폴더 선택</button>
          <button id="useDownloadsBtn" class="btn btn-secondary">다운로드 폴더 사용</button>
        </div>
      </section>

      <section class="preview-section" id="previewSection" style="display: none;">
        <h2>미리보기</h2>
        <div id="previewContent"></div>
        <div class="action-buttons">
          <button id="organizeBtn" class="btn btn-primary">정리 시작</button>
          <button id="rescanBtn" class="btn btn-secondary">다시 스캔</button>
        </div>
      </section>

      <section class="results-section" id="resultsSection" style="display: none;">
        <h2>정리 완료</h2>
        <div id="resultsContent"></div>
        <button id="newScanBtn" class="btn btn-primary">새로 시작</button>
      </section>

      <section class="settings-section">
        <details>
          <summary>⚙️ 설정</summary>
          <div class="settings-content">
            <label>
              <input type="checkbox" id="createDateFolders">
              날짜별 하위 폴더 생성 (예: 2024-01)
            </label>
            <label>
              <input type="checkbox" id="skipHiddenFiles" checked>
              숨김 파일 건너뛰기
            </label>
            <div class="categories-info">
              <h3>카테고리 분류:</h3>
              <ul>
                <li><strong>이미지:</strong> jpg, png, gif, svg 등</li>
                <li><strong>문서:</strong> pdf, doc, xls, ppt 등</li>
                <li><strong>비디오:</strong> mp4, avi, mkv 등</li>
                <li><strong>오디오:</strong> mp3, wav, flac 등</li>
                <li><strong>압축파일:</strong> zip, rar, 7z 등</li>
                <li><strong>프로그램:</strong> exe, dmg, deb 등</li>
                <li><strong>코드:</strong> js, py, java, html 등</li>
                <li><strong>기타:</strong> 나머지 모든 파일</li>
              </ul>
            </div>
          </div>
        </details>
      </section>
    </main>

    <footer>
      <div id="statusBar" class="status-bar">준비</div>
    </footer>
  </div>

  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <p>처리 중...</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
